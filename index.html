<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>食衣住行育樂帳本</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="帳本">
<meta name="theme-color" content="#2f5d50">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: single column ledger — entry form, month summary with six-category bars, day-grouped list */
:root{
  --bg:#f3f4f1; --surface:#ffffff; --fg:#1d2420; --muted:#6a736d; --line:#dfe3de; --accent:#2f5d50;
  --c-food:#c0623b; --c-cloth:#8a5a9e; --c-home:#3f6f9a; --c-move:#4f8a5b; --c-edu:#b38a1e; --c-fun:#c24868;
  --danger:#b3412f;
  --f-display:"Noto Serif TC","Songti TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141917; --surface:#1d2421; --fg:#e7ece8; --muted:#94a09a; --line:#2c3531; --accent:#7fbfa9;
  --c-food:#e08a63; --c-cloth:#b98ccc; --c-home:#79a6d1; --c-move:#82bb8d; --c-edu:#d9b44c; --c-fun:#e57a95;
  --danger:#e57b6a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917; --surface:#1d2421; --fg:#e7ece8; --muted:#94a09a; --line:#2c3531; --accent:#7fbfa9;
  --c-food:#e08a63; --c-cloth:#b98ccc; --c-home:#79a6d1; --c-move:#82bb8d; --c-edu:#d9b44c; --c-fun:#e57a95;
  --danger:#e57b6a; color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:900;font-size:1.6rem;margin:0;letter-spacing:.04em}
.sync{font-size:.78rem;color:var(--muted)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
label.lbl{font-size:.75rem;color:var(--muted);letter-spacing:.08em;display:block;margin-bottom:6px}
.amount{display:flex;align-items:center;gap:6px;border-bottom:2px solid var(--line);padding-bottom:4px}
.amount span{font-family:var(--f-num);font-size:1.6rem;color:var(--muted)}
.amount input{border:0;background:transparent;color:var(--fg);font-family:var(--f-num);font-size:2rem;width:100%;min-width:0;outline:none}
.amount:focus-within{border-color:var(--accent)}
.cats{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:14px}
.cat{appearance:none;border:1.5px solid var(--line);background:transparent;color:var(--fg);border-radius:10px;padding:8px 0 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0;font-family:var(--f-body)}
.cat b{font-family:var(--f-display);font-weight:900;font-size:1.45rem;line-height:1.2;color:var(--k)}
.cat small{font-size:.66rem;color:var(--muted)}
.cat[aria-pressed="true"]{background:var(--k);border-color:var(--k)}
.cat[aria-pressed="true"] b,.cat[aria-pressed="true"] small{color:var(--surface)}
.cat:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row2{display:grid;grid-template-columns:auto 1fr;gap:10px;margin-top:14px}
.row2 input,.month select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0;width:100%}
.submit{margin-top:14px;width:100%;border:0;border-radius:10px;padding:12px;background:var(--accent);color:var(--surface);font:700 1rem var(--f-body);letter-spacing:.2em;cursor:pointer}
.submit:disabled{opacity:.45;cursor:default}
.msg{min-height:1.2em;font-size:.8rem;color:var(--muted);margin-top:8px}
.month{display:flex;align-items:center;justify-content:space-between;gap:10px}
.month button{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;width:36px;height:36px;font-size:1rem;cursor:pointer}
.month .mid{text-align:center;flex:1}
.month .mid .ym{font-family:var(--f-display);font-weight:600;font-size:1.05rem}
.total{font-size:2.1rem;line-height:1.1}
.bars{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.bar{display:grid;grid-template-columns:2rem 1fr auto;align-items:center;gap:10px;cursor:pointer;border:0;background:none;color:inherit;padding:0;font:inherit;text-align:left}
.bar b{font-family:var(--f-display);font-weight:900;font-size:1.15rem;color:var(--k)}
.track{height:10px;background:var(--bg);border-radius:5px;overflow:hidden}
.fill{height:100%;background:var(--k);border-radius:5px;transition:width .35s ease}
.bar .v{font-size:.85rem;min-width:7.5rem;text-align:right}
.bar .v i{font-style:normal;color:var(--muted);font-size:.75rem;margin-left:6px}
.bar[aria-pressed="true"] .track{outline:1.5px solid var(--k);outline-offset:2px}
.filterNote{font-size:.8rem;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.filterNote button{border:0;background:none;color:var(--accent);font:inherit;cursor:pointer;padding:0}
.day{display:flex;flex-direction:column}
.dayhead{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);padding:10px 2px 4px;border-bottom:1px solid var(--line);letter-spacing:.05em}
.item{display:grid;grid-template-columns:2.2rem 1fr auto auto;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.item .g{width:2.2rem;height:2.2rem;border-radius:8px;background:color-mix(in srgb,var(--k) 16%,transparent);color:var(--k);display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:1.1rem}
.item .note{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .note small{display:block;color:var(--muted);font-size:.72rem}
.item .del{border:0;background:none;color:var(--muted);cursor:pointer;font-size:.78rem;padding:4px}
.item .del.confirm{color:var(--danger);font-weight:700}
.empty{text-align:center;color:var(--muted);padding:28px 8px;font-size:.9rem}
.empty b{display:block;font-family:var(--f-display);font-size:1.6rem;letter-spacing:.3em;color:var(--fg);margin-bottom:6px}
.foot{display:flex;justify-content:flex-end}
.foot button{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:6px 12px;font:inherit;font-size:.8rem;cursor:pointer}
@media (max-width:380px){.cats{grid-template-columns:repeat(3,1fr)}.bar .v{min-width:6rem}}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}
.foot{gap:8px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>食衣住行育樂</h1>
    <span class="sync" id="sync">連線中…</span>
  </header>

  <form class="panel" id="form" autocomplete="off">
    <label class="lbl" for="amt">金額</label>
    <div class="amount"><span>$</span><input id="amt" inputmode="decimal" placeholder="0.00" aria-label="金額"></div>
    <div class="cats" id="cats" role="group" aria-label="分類"></div>
    <div class="row2">
      <input type="date" id="date" aria-label="日期">
      <input id="note" placeholder="備註（例：Costco、加油）" maxlength="60" aria-label="備註">
    </div>
    <button class="submit" id="submit" type="submit" disabled>記一筆</button>
    <div class="msg" id="msg"></div>
  </form>

  <section class="panel">
    <div class="month">
      <button id="prev" aria-label="上個月">‹</button>
      <div class="mid">
        <div class="ym" id="ym"></div>
        <div class="total num" id="total">$0</div>
      </div>
      <button id="next" aria-label="下個月">›</button>
    </div>
    <div class="bars" id="bars"></div>
  </section>

  <section>
    <div class="filterNote" id="filterNote" hidden><span id="filterText"></span><button id="clearFilter">顯示全部</button></div>
    <div id="list"></div>
  </section>

  <div class="foot">
    <button id="csv" hidden>匯出本月 CSV</button>
    <button id="backup">備份全部（JSON）</button>
    <button id="restoreBtn">匯入備份</button>
    <input type="file" id="restore" accept=".json,application/json" hidden>
  </div>

  <details class="panel settings" id="settings">
    <summary>雲端同步設定（Google Sheets）</summary>
    <div class="sgrid">
      <label class="lbl" for="sUrl">Apps Script 網址（結尾是 /exec）</label>
      <input id="sUrl" placeholder="https://script.google.com/macros/s/…/exec" spellcheck="false">
      <label class="lbl" for="sToken">密鑰（執行 setup 後在記錄裡看到的那串）</label>
      <input id="sToken" placeholder="貼上密鑰" spellcheck="false">
      <label class="lbl" for="sName">記錄人（選填，例如 Daniel）</label>
      <input id="sName" placeholder="這台裝置是誰在記" maxlength="20">
      <div class="sbtns">
        <button type="button" id="sSave" class="submit">儲存並同步</button>
        <button type="button" id="sClear" class="ghost">中斷連線</button>
      </div>
      <div class="msg" id="sMsg"></div>
    </div>
  </details>
</div>

<style>
.settings summary{cursor:pointer;font-size:.85rem;color:var(--muted)}
.settings[open] summary{margin-bottom:12px;color:var(--fg)}
.sgrid{display:flex;flex-direction:column;gap:6px}
.sgrid input{font:inherit;font-size:.85rem;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0;margin-bottom:6px}
.sbtns{display:flex;gap:8px;flex-wrap:wrap}
.sbtns .submit{margin-top:0;flex:1;letter-spacing:.1em}
.ghost{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:10px;padding:12px 14px;font:inherit;cursor:pointer}
.sync.ok{color:var(--c-move)} .sync.warn{color:var(--c-edu)} .sync.err{color:var(--danger)}
.item .pend{color:var(--c-edu)}
</style>

<script>
const CATS=[
  {k:"food",g:"食",n:"飲食",c:"--c-food"},
  {k:"cloth",g:"衣",n:"服飾",c:"--c-cloth"},
  {k:"home",g:"住",n:"居住",c:"--c-home"},
  {k:"move",g:"行",n:"交通",c:"--c-move"},
  {k:"edu",g:"育",n:"教育",c:"--c-edu"},
  {k:"fun",g:"樂",n:"娛樂",c:"--c-fun"}];
const CAT=Object.fromEntries(CATS.map(c=>[c.k,c]));
const $=id=>document.getElementById(id);
const fmt=n=>"$"+n.toLocaleString("en-US",{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2});
const pad=n=>String(n).padStart(2,"0");
const today=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const newId=()=>"e"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);

// items: {id,amount,cat,date,note,by,ts,_dirty?}
let items=[], delQueue=[], cfg={url:"",token:"",name:""};
let selCat=null, filterCat=null, pendingDel=null;
let view=new Date(); view.setDate(1);

// ---------- local storage
const LS={items:"ledger6",del:"ledger6_del",cfg:"ledger6_cfg"};
function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
function saveLocal(){lsSet(LS.items,items);lsSet(LS.del,delQueue)}
items=lsGet(LS.items,[]); delQueue=lsGet(LS.del,[]); cfg=Object.assign(cfg,lsGet(LS.cfg,{}));

// ---------- category chips + form
$("cats").innerHTML=CATS.map(c=>`<button type="button" class="cat" data-k="${c.k}" aria-pressed="false" style="--k:var(${c.c})"><b>${c.g}</b><small>${c.n}</small></button>`).join("");
$("cats").addEventListener("click",e=>{const b=e.target.closest(".cat");if(!b)return;selCat=b.dataset.k;
  document.querySelectorAll(".cat").forEach(x=>x.setAttribute("aria-pressed",x===b));validate()});
$("date").value=today();
const parseAmt=()=>{const v=parseFloat($("amt").value.replace(/[^0-9.]/g,""));return isFinite(v)&&v>0?Math.round(v*100)/100:0};
function validate(){$("submit").disabled=!(parseAmt()&&selCat&&$("date").value)}
$("amt").addEventListener("input",validate);$("date").addEventListener("input",validate);

$("form").addEventListener("submit",e=>{
  e.preventDefault(); const amount=parseAmt(); if(!amount||!selCat)return;
  const rec={id:newId(),amount,cat:selCat,date:$("date").value,note:$("note").value.trim(),by:cfg.name||"",ts:Date.now(),_dirty:true};
  items.push(rec); saveLocal();
  $("msg").textContent=`已記錄 ${CAT[rec.cat].g} ${fmt(amount)}`;
  $("amt").value="";$("note").value="";
  const d=new Date(rec.date+"T00:00");
  if(d.getMonth()!==view.getMonth()||d.getFullYear()!==view.getFullYear())view=new Date(d.getFullYear(),d.getMonth(),1);
  render(); validate(); $("amt").focus(); sync();
});

// ---------- month nav / filter
$("prev").onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);filterCat=null;render()};
$("next").onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);filterCat=null;render()};
$("clearFilter").onclick=()=>{filterCat=null;render()};
$("bars").addEventListener("click",e=>{const b=e.target.closest(".bar");if(!b)return;filterCat=filterCat===b.dataset.k?null:b.dataset.k;render()});

function monthItems(){const key=view.getFullYear()+"-"+pad(view.getMonth()+1);return items.filter(i=>i.date&&i.date.startsWith(key))}
function esc(s){return String(s||"").replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]))}

function render(){
  $("ym").textContent=`${view.getFullYear()} 年 ${view.getMonth()+1} 月`;
  const m=monthItems(); const total=m.reduce((s,i)=>s+i.amount,0);
  $("total").textContent=fmt(total);
  const sums=Object.fromEntries(CATS.map(c=>[c.k,0])); m.forEach(i=>{if(sums[i.cat]!=null)sums[i.cat]+=i.amount});
  const max=Math.max(...Object.values(sums),1);
  $("bars").innerHTML=CATS.map(c=>{const v=sums[c.k],p=total?Math.round(v/total*100):0;
    return `<button class="bar" data-k="${c.k}" aria-pressed="${filterCat===c.k}" style="--k:var(${c.c})" aria-label="${c.n} ${fmt(v)}">
      <b>${c.g}</b><div class="track"><div class="fill" style="width:${v/max*100}%"></div></div>
      <span class="v num">${fmt(v)}<i>${p}%</i></span></button>`}).join("");
  $("filterNote").hidden=!filterCat;
  if(filterCat)$("filterText").textContent=`只看「${CAT[filterCat].g}・${CAT[filterCat].n}」`;
  const shown=m.filter(i=>!filterCat||i.cat===filterCat).sort((a,b)=>b.date.localeCompare(a.date)||b.ts-a.ts);
  $("csv").hidden=!m.length;
  if(!shown.length){
    $("list").innerHTML=`<div class="empty"><b>${filterCat?CAT[filterCat].g:"食衣住行育樂"}</b>${items.length?"這個月還沒有紀錄。":"還沒有任何紀錄。在上面輸入金額、選一個分類，按「記一筆」就開始。"}</div>`;return}
  const byDay={}; shown.forEach(i=>(byDay[i.date]=byDay[i.date]||[]).push(i));
  const wk="日一二三四五六";
  $("list").innerHTML=Object.keys(byDay).map(d=>{const dt=new Date(d+"T00:00"),ds=byDay[d].reduce((s,i)=>s+i.amount,0);
    return `<div class="day"><div class="dayhead"><span>${dt.getMonth()+1}/${dt.getDate()}（${wk[dt.getDay()]}）</span><span class="num">${fmt(ds)}</span></div>`+
    byDay[d].map(i=>{const c=CAT[i.cat]||CATS[0];
      const sub=[c.n,i.by?esc(i.by):"",(i._dirty&&cfg.url)?'<span class="pend">待上傳</span>':""].filter(Boolean).join(" · ");
      return `<div class="item" style="--k:var(${c.c})"><div class="g">${c.g}</div>
      <div class="note">${esc(i.note)||c.n}<small>${sub}</small></div><span class="num">${fmt(i.amount)}</span>
      <button class="del${pendingDel===i.id?" confirm":""}" data-id="${esc(i.id)}">${pendingDel===i.id?"確定刪除":"刪除"}</button></div>`}).join("")+`</div>`}).join("");
}

$("list").addEventListener("click",e=>{const b=e.target.closest(".del");if(!b)return;const id=b.dataset.id;
  if(pendingDel!==id){pendingDel=id;render();setTimeout(()=>{if(pendingDel===id){pendingDel=null;render()}},3000);return}
  pendingDel=null;
  const it=items.find(i=>i.id===id);
  items=items.filter(i=>i.id!==id);
  if(it&&cfg.url&&!delQueue.includes(id))delQueue.push(id);   // removing an id the sheet never had is harmless
  saveLocal();render();sync();
});

// ---------- export / backup
$("csv").onclick=()=>{const m=monthItems().sort((a,b)=>a.date.localeCompare(b.date));
  const rows=[["日期","分類","類別","金額","備註","記錄人"],...m.map(i=>[i.date,CAT[i.cat].g,CAT[i.cat].n,i.amount,i.note,i.by||""])];
  const csv="﻿"+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
  saveFile(`expenses-${view.getFullYear()}-${pad(view.getMonth()+1)}.csv`,new Blob([csv],{type:"text/csv"}))};
function saveFile(name,blob){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$("backup").onclick=()=>saveFile(`expenses-backup-${today()}.json`,
  new Blob([JSON.stringify(items.map(({_dirty,...r})=>r),null,1)],{type:"application/json"}));
$("restoreBtn").onclick=()=>$("restore").click();
$("restore").addEventListener("change",async e=>{const f=e.target.files[0];if(!f)return;
  try{const data=JSON.parse(await f.text());if(!Array.isArray(data))throw 0;
    const ids=new Set(items.map(i=>i.id));let added=0;
    data.forEach(r=>{const x=clean(r);if(x&&!ids.has(x.id)){x._dirty=true;items.push(x);ids.add(x.id);added++}});
    saveLocal();render();sync();$("msg").textContent=`已匯入 ${added} 筆（重複的已略過）`}
  catch{$("msg").textContent="這個檔案不是帳本備份，請選擇「備份全部」匯出的 JSON。"}
  e.target.value=""});
function clean(r){
  if(!r||!r.id||!CAT[r.cat]||!(+r.amount>0)||!/^\d{4}-\d{2}-\d{2}$/.test(String(r.date)))return null;
  return {id:String(r.id),amount:Math.round(+r.amount*100)/100,cat:r.cat,date:String(r.date),note:String(r.note||""),by:String(r.by||""),ts:+r.ts||Date.now()};
}

// ---------- cloud sync (Google Apps Script web app)
const status=(t,cls)=>{const s=$("sync");s.textContent=t;s.className="sync"+(cls?" "+cls:"")};
let syncing=false, again=false;

async function api(body){
  const r=await fetch(cfg.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify(Object.assign({token:cfg.token},body))});
  if(!r.ok)throw new Error("http "+r.status);
  const j=await r.json(); if(!j.ok)throw new Error(j.error||"server");
  return j;
}

async function sync(){
  if(!cfg.url||!cfg.token){status(items.length?"只存在這台裝置":"尚未設定雲端","warn");return}
  if(syncing){again=true;return}
  if(!navigator.onLine){const n=items.filter(i=>i._dirty).length+delQueue.length;status(`離線中${n?`，${n} 筆待上傳`:""}`,"warn");return}
  syncing=true; status("同步中…");
  try{
    const up=items.filter(i=>i._dirty).map(({_dirty,...r})=>r), del=[...delQueue];
    const j=await api({action:"sync",upsert:up,remove:del});
    const sentIds=new Set(up.map(r=>r.id));
    delQueue=delQueue.filter(id=>!del.includes(id));
    // server list is the truth; keep local rows edited after the request went out
    const stillDirty=items.filter(i=>i._dirty&&!sentIds.has(i.id));
    const server=(j.items||[]).map(clean).filter(Boolean).filter(r=>!delQueue.includes(r.id));
    const seen=new Set(server.map(r=>r.id));
    items=[...server,...stillDirty.filter(i=>!seen.has(i.id))];
    saveLocal(); render();
    const t=new Date(); status(`已同步 ${pad(t.getHours())}:${pad(t.getMinutes())}`,"ok");
  }catch(err){
    const msg=String(err.message||err);
    status(msg==="bad_token"?"密鑰不對，請檢查設定":"同步失敗，稍後會再試","err");
    if(msg==="bad_token")$("settings").open=true;
  }finally{syncing=false; if(again){again=false;sync()}}
}

// ---------- settings
$("sUrl").value=cfg.url; $("sToken").value=cfg.token; $("sName").value=cfg.name;
if(!cfg.url)$("settings").open=true;
$("sSave").onclick=async()=>{
  const url=$("sUrl").value.trim(), token=$("sToken").value.trim();
  if(url&&!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(url)){$("sMsg").textContent="網址格式不對：要是 https://script.google.com/macros/s/…/exec";return}
  if(url&&!token){$("sMsg").textContent="請貼上密鑰。";return}
  const first=!cfg.url&&url;
  cfg={url,token,name:$("sName").value.trim()}; lsSet(LS.cfg,cfg);
  if(first)items.forEach(i=>i._dirty=true);   // upload what this device already has
  saveLocal(); $("sMsg").textContent=url?"已儲存，正在同步…":"已儲存。"; await sync();
  if($("sync").classList.contains("ok"))$("sMsg").textContent="連線成功。";
};
$("sClear").onclick=()=>{cfg={url:"",token:"",name:cfg.name};lsSet(LS.cfg,cfg);$("sUrl").value="";$("sToken").value="";
  $("sMsg").textContent="已中斷，資料保留在這台裝置。";sync()};

// ---------- triggers
addEventListener("online",sync);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")sync()});
setInterval(()=>{if(document.visibilityState==="visible")sync()},60000);

render(); sync();
</script>
</body>
</html>
